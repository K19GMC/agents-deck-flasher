name: perm test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: token permissions and write test
        run: |
          curl -s -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/${{ github.repository }} -o r.json
          python3 -c "import json;print('PERMS',json.load(open('r.json')).get('permissions'))"
          git config user.email "bot@example.com"
          git config user.name "bot"
          date -u > perm-test.txt
          git add perm-test.txt
          git commit -q -m "perm test"
          git push && echo PUSH_OK || echo PUSH_FAIL
